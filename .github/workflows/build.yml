name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libzbar0 libegl1 libxkbcommon0 libgl1 \
            fuse libfuse2

      - name: Install system dependencies (macOS)
        if: matrix.name == 'macos'
        run: brew install zbar

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export icon assets
        run: python3 scripts/export_icon.py dist-icons

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm wg_tray.spec

      # ---------------- macOS: .app zip + .dmg ----------------

      - name: Package macOS app (zip)
        if: matrix.name == 'macos'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent wg-tray.app wg-tray-macos.zip

      - name: Build macOS .dmg
        if: matrix.name == 'macos'
        run: |
          brew install create-dmg
          create-dmg \
            --volname "wg-tray" \
            --window-size 500 300 \
            --icon-size 96 \
            --icon "wg-tray.app" 125 120 \
            --app-drop-link 375 120 \
            "dist/wg-tray-macos.dmg" \
            "dist/wg-tray.app" || true

      # ---------------- Linux: tar.gz + AppImage ----------------

      - name: Package Linux build (tar.gz)
        if: matrix.name == 'linux'
        run: |
          cd dist
          tar -czf wg-tray-linux.tar.gz wg-tray

      - name: Build Linux AppImage
        if: matrix.name == 'linux'
        run: |
          set -euo pipefail
          curl -L -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

          APPDIR=AppDir
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          cp -r dist/wg-tray/* "$APPDIR/usr/bin/"
          cp dist-icons/icon_256.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/wg-tray.png"
          cp dist-icons/icon_256.png "$APPDIR/wg-tray.png"

          cat > "$APPDIR/wg-tray.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=wg-tray
          Comment=Tiny no-telemetry WireGuard tray client
          Exec=wg-tray
          Icon=wg-tray
          Categories=Network;Security;
          Terminal=false
          EOF

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "$HERE/usr/bin/wg-tray" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          ARCH=x86_64 ./appimagetool "$APPDIR" "dist/wg-tray-x86_64.AppImage"

      # ---------------- Windows: zip + Inno Setup installer ----------------

      - name: Package Windows build (zip)
        if: matrix.name == 'windows'
        run: |
          cd dist
          Compress-Archive -Path wg-tray -DestinationPath wg-tray-windows.zip

      - name: Convert icon to .ico
        if: matrix.name == 'windows'
        run: |
          python -m pip install pillow
          python -c "
          from PIL import Image
          img = Image.open('dist-icons/icon.png')
          img.save('dist/icon.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          "

      - name: Build Windows installer (Inno Setup)
        if: matrix.name == 'windows'
        env:
          WGTRAY_VERSION: ${{ steps.version.outputs.version }}
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          Copy-Item dist-installer\wg-tray-windows-setup.exe dist\wg-tray-windows-setup.exe
        shell: pwsh

      # ---------------- Upload ----------------

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wg-tray-${{ matrix.name }}
          path: |
            dist/wg-tray-macos.zip
            dist/wg-tray-macos.dmg
            dist/wg-tray-linux.tar.gz
            dist/wg-tray-x86_64.AppImage
            dist/wg-tray-windows.zip
            dist/wg-tray-windows-setup.exe
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir release
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.exe" \) -exec cp {} release/ \;
          ls -la release

      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Extract this version's changelog section
        id: changelog
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          # Pull the "## <version>" section out of CHANGELOG.md (stops at
          # the next "## " heading). This is what the in-app "What's new"
          # dialog and the GitHub Release page both show as the release
          # body — without it, generate_release_notes alone only produces
          # a bare commit-compare link, not actual prose.
          awk -v ver="## $VERSION" '
            $0 == ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > body.md

          if [ ! -s body.md ]; then
            echo "::warning::No CHANGELOG.md section found for $VERSION; release body will just be the commit list."
          fi

          {
            echo "body<<CHANGELOG_EOF"
            cat body.md
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: true
          append_body: true
